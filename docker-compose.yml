version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres-db:
    image: postgres:15-alpine
    container_name: mi-postgres-db
    environment:
      POSTGRES_PASSWORD: supersecreta
      POSTGRES_DB: todolist_db
      POSTGRES_USER: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # Aplicación Spring Boot
  backend-app:
    build: .
    container_name: to-do-list-app
    ports:
      - "8080:8080"
    environment:
      # Configuramos el perfil deploy
      - SPRING_PROFILES_ACTIVE=deploy
      # Pasamos las variables de entorno de BD
      - DB_HOST=postgres-db
      - DB_NAME=todolist_db
      - DB_USER=root
      - DB_PASSWORD=supersecreta
    depends_on:
      - postgres-db
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
