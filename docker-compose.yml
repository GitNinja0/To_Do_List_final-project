version: '3.8'

services:
  # Base de datos MySQL
  mysql-db:
    image: mysql:8.0
    container_name: mi-mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: supersecreta
      MYSQL_DATABASE: todolist_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  # Aplicación Spring Boot
  backend-app:
    build: .
    container_name: to-do-list-app
    ports:
      - "8080:8080"
    environment:
      # Configuramos el perfil deploy
      - SPRING_PROFILES_ACTIVE=deploy
      # Pasamos las variables de entorno de BD
      - DB_HOST=mysql-db
      - DB_NAME=todolist_db
      - DB_USER=root
      - DB_PASSWORD=supersecreta
    depends_on:
      - mysql-db
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
